name: Build and Release MicLock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        uses: Brahgn/actions-inno-setup@v1

      - name: Restore Dependencies
        run: dotnet restore MicLock.sln

      - name: Run Unit & Integration Tests
        run: dotnet test MicLock.sln --configuration Release --verbosity normal

      - name: Publish Single-File Executable
        run: >
          dotnet publish src/MicLock.App/MicLock.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/win-x64

      - name: Build Inno Setup Installer
        run: iscc installer/MicLock.iss

      - name: Package Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/installer/MicLock-Portable-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/MicLock-Setup-*.exe
            dist/installer/MicLock-Portable-win-x64.zip
          generate_release_notes: true
