name: Build and Release MicLock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore Dependencies
        run: dotnet restore MicLock.sln

      - name: Run Unit & Integration Tests
        run: dotnet test MicLock.sln --configuration Release --verbosity normal

      - name: Publish MicLock Executable
        run: >
          dotnet publish src/MicLock.App/MicLock.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/win-x64

      - name: Publish MicMute Executable
        run: >
          dotnet publish src/MicMute.App/MicMute.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/win-x64

      - name: Build Inno Setup Installer
        run: iscc installer/MicLock.iss

      - name: Package Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/installer/MicAnchor-Portable-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/MicAnchor-Setup-*.exe
            dist/installer/MicAnchor-Portable-win-x64.zip
          generate_release_notes: true
